<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-mecanismo"
        class="scene"
        data-composition-id="02-mecanismo"
        data-composition-src="compositions/frames/02-mecanismo.html"
        data-start="6"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-03-cifras"
        class="scene"
        data-composition-id="03-cifras"
        data-composition-src="compositions/frames/03-cifras.html"
        data-start="13.5"
        data-duration="6.9"
        data-track-index="0"
      ></div>

      <div
        id="el-04-ventajas"
        class="scene"
        data-composition-id="04-ventajas"
        data-composition-src="compositions/frames/04-ventajas.html"
        data-start="20"
        data-duration="6.6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-oferta"
        class="scene"
        data-composition-id="05-oferta"
        data-composition-src="compositions/frames/05-oferta.html"
        data-start="26"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="31"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 6);
        tl.fromTo("#el-02-mecanismo", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 6);
        tl.to("#el-02-mecanismo", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 13.5);
        tl.fromTo("#el-03-cifras", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 13.5);
        tl.to("#el-03-cifras", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 20);
        tl.fromTo("#el-04-ventajas", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", opacity: 1, duration: 0.4, ease: "power3.inOut" }, 20);
        tl.to("#el-04-ventajas", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 26);
        tl.fromTo("#el-05-oferta", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 26);
        tl.to("#el-05-oferta", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.to({}, { duration: 35 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
