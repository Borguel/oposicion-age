  <rect x="284" y="428" width="70" height="8" rx="4" fill="#d8dce6" />
  <circle cx="272" cy="452" r="6" fill="none" stroke="#c7cede" stroke-width="2" />
  <rect x="284" y="448" width="60" height="8" rx="4" fill="#d8dce6" />

