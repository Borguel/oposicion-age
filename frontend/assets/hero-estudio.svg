<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#ffa633" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffa633" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333a56" />
      <stop offset="100%" stop-color="#262c40" />
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb752" />
      <stop offset="100%" stop-color="#f6941f" />
    </linearGradient>
    <linearGradient id="legs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262c40" />
      <stop offset="100%" stop-color="#1b1f2e" />
    </linearGradient>
  </defs>

  <circle cx="320" cy="300" r="270" fill="url(#glow)" />

  <!-- Sombra suave en el suelo -->
  <ellipse cx="320" cy="572" rx="188" ry="20" fill="#000" opacity="0.16" />

  <!-- Silla: respaldo + asiento + reposabrazos -->
  <rect x="176" y="238" width="288" height="248" rx="34" fill="url(#chairBack)" />
  <rect x="196" y="410" width="248" height="70" rx="22" fill="#3a4160" />
  <rect x="150" y="392" width="34" height="96" rx="17" fill="#2c3350" />
  <rect x="456" y="392" width="34" height="96" rx="17" fill="#2c3350" />

  <!-- Piernas: muslo + gemba, con pie -->
  <path d="M256 440 Q234 468 240 500 Q244 524 232 548 L286 548 Q292 520 280 500 Q270 470 288 444 Z" fill="url(#legs)" />
  <path d="M384 440 Q406 468 400 500 Q396 524 408 548 L354 548 Q348 520 360 500 Q370 470 352 444 Z" fill="url(#legs)" />
  <rect x="220" y="538" width="76" height="26" rx="13" fill="#f6941f" />
  <rect x="344" y="538" width="76" height="26" rx="13" fill="#f6941f" />

  <!-- Brazos: trazo grueso con extremos redondeados, tono de manga distinto al torso -->
  <path d="M276 322 Q226 352 240 402" stroke="#e8860f" stroke-width="46" stroke-linecap="round" fill="none" />
  <path d="M364 322 Q414 352 400 402" stroke="#e8860f" stroke-width="46" stroke-linecap="round" fill="none" />
  <circle cx="240" cy="404" r="22" fill="#f7c99a" />
  <circle cx="400" cy="404" r="22" fill="#f7c99a" />

  <!-- Torso: sudadera con capucha simplificada -->
  <path d="M244 292 Q320 254 396 292 Q414 320 408 408 Q320 448 232 408 Q226 320 244 292 Z" fill="url(#torso)" />
  <path d="M320 300 L320 420" stroke="#e8860f" stroke-width="3" opacity="0.5" />
  <path d="M256 300 Q320 274 384 300 Q392 312 388 328 Q320 300 252 328 Q248 312 256 300 Z" fill="#e8860f" opacity="0.35" />

  <!-- Cuello (corto, para que la cabeza no quede flotando) -->
  <rect x="296" y="238" width="48" height="34" rx="16" fill="#f7c99a" />

  <!-- Cabeza -->
  <circle cx="320" cy="192" r="56" fill="#ffd9ab" />

  <!-- Orejas -->
  <circle cx="265" cy="214" r="10" fill="#ffd9ab" />
  <circle cx="375" cy="214" r="10" fill="#ffd9ab" />

  <!-- Pelo: casquete corto y completo -->
  <path d="M264 196 Q260 122 320 118 Q380 122 376 196 Q376 158 320 158 Q264 158 264 196 Z" fill="#3a2a1d" />

  <!-- Tablet -->
  <rect x="244" y="356" width="152" height="112" rx="16" fill="#0f1320" />
  <rect x="257" y="368" width="126" height="88" rx="6" fill="#eef1f6" />

  <!-- UI de test dentro de la tablet -->
  <rect x="268" y="379" width="72" height="9" rx="4.5" fill="#c7cede" />
  <circle cx="273" cy="404" r="6.5" fill="#2ecc71" />
  <rect x="286" y="400" width="88" height="8" rx="4" fill="#dde1ea" />
  <circle cx="273" cy="425" r="6.5" fill="none" stroke="#c7cede" stroke-width="2" />
  <rect x="286" y="421" width="72" height="8" rx="4" fill="#dde1ea" />
  <circle cx="273" cy="446" r="6.5" fill="none" stroke="#c7cede" stroke-width="2" />
  <rect x="286" y="442" width="62" height="8" rx="4" fill="#dde1ea" />

  <!-- Insignia flotante de acierto -->
  <g transform="translate(440,300)">
    <circle cx="0" cy="-4" r="36" fill="#2ecc71" />
    <path d="M-15 -3 L-4 9 L17 -17" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Chispas decorativas -->
  <circle cx="146" cy="150" r="6" fill="#ffa633" opacity="0.7" />
  <circle cx="512" cy="188" r="4.5" fill="#ffa633" opacity="0.5" />
  <circle cx="116" cy="392" r="4.5" fill="#ffa633" opacity="0.5" />
  <circle cx="500" cy="440" r="3.5" fill="#ffa633" opacity="0.45" />
</svg>
