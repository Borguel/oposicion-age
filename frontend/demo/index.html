<!DOCTYPE html>
<html lang="es">
<head>
  <script>if(location.hostname==="oposicion-age-1.onrender.com"){location.replace("https://www.dominatuopo.com"+location.pathname+location.search+location.hash);}</script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffa633" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba gratis sin registrarte - Domina tu Opo</title>
  <meta name="description" content="Responde 5 preguntas reales de examen oficial ahora mismo, sin crear ninguna cuenta. Así es Domina tu Opo por dentro." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Prueba gratis sin registrarte - Domina tu Opo" />
  <meta property="og:description" content="Responde 5 preguntas reales de examen oficial ahora mismo, sin crear ninguna cuenta." />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://www.dominatuopo.com/demo/" />
    <script>try{if(localStorage.getItem("age-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/test-generator/style.css" />
  <link rel="stylesheet" href="/demo/style.css" />
</head>
<body>
  <nav class="age-nav"></nav>

  <div class="demo-header">
    <div class="age-container">
      <span class="age-pill age-pill-primary"><span data-icon="rayo" data-icon-size="16"></span> Sin registrarte</span>
      <h1>Pruébalo tú mismo</h1>
      <p>5 preguntas reales de examen oficial, exactamente igual que un test dentro de la web. Sin crear ninguna cuenta, sin tarjeta, sin compromiso.</p>
      <div class="demo-selector-oposicion">
        <label for="demo-oposicion">Oposición</label>
        <select id="demo-oposicion" class="age-input">
          <option value="AGE">Cuerpo General Administrativo (AGE)</option>
          <option value="GACE">Cuerpo de Gestión (GACE)</option>
          <option value="AUXILIAR">Cuerpo General Auxiliar (Auxiliar)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="age-container demo-contenido">
    <div id="demo-cargando" class="age-card demo-cargando">
      <p>Cargando preguntas…</p>
    </div>

    <div id="demo-error" class="age-card demo-cargando" style="display:none;"></div>

    <div id="navegador-preguntas" class="navegador-preguntas" style="display:none;"></div>
    <div id="contenedor-test" class="card fade-in" style="display:none;"></div>
    <div id="contenedor-resultados" style="display:none;"></div>
    <button id="btn-descargar-pdf" class="btn btn-secondary btn-block" style="display:none;">Descargar PDF del test</button>
  </div>

  <!-- Librerías externas -- mismas que usa el test oficial real, para que
       la corrección y el PDF de resultados se comporten exactamente igual. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module" src="/assets/auth.js"></script>
  <script type="module" src="/demo/script.js"></script>
</body>
</html>
