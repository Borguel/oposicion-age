  <meta property="og:title" content="Repasar preguntas - Domina tu Opo" />

  <link rel="stylesheet" href="/repasar-preguntas/style.css" />
</head>
<body>
<nav class="age-nav"></nav>

  <div class="container">

    <div class="rp-cabecera">
      <h1>Repasar preguntas</h1>
      <p>Consulta el enunciado completo, la respuesta correcta y la explicación, sin necesidad de generar un test nuevo.</p>
    </div>

    <div class="rp-tabs" role="tablist">
      <button type="button" class="rp-tab activa" id="rp-tab-favoritas" data-tab="favoritas" role="tab" aria-selected="true">
        <span data-icon="estrella" data-icon-size="16"></span> Favoritas
      </button>
      <button type="button" class="rp-tab" id="rp-tab-falladas" data-tab="falladas" role="tab" aria-selected="false">
        <span data-icon="cruz" data-icon-size="16"></span> Falladas
      </button>
    </div>

    <div class="rp-filtro-fila">
      <div class="rp-filtro-grupo">
        <label for="rp-filtro-bloque">Filtrar por bloque:</label>
        <select id="rp-filtro-bloque">
          <option value="">Todos los bloques</option>
        </select>
      </div>
      <div class="rp-filtro-grupo">
        <label for="rp-filtro-tema">Filtrar por tema:</label>
        <select id="rp-filtro-tema">
          <option value="">Todos los temas</option>
        </select>
      </div>
    </div>

    <div id="rp-aviso" class="aviso" style="display:none;"></div>
    <div id="rp-cargando" class="rp-cargando">Cargando preguntas…</div>
    <div id="rp-lista" class="rp-lista"></div>
  </div>

  <script type="module" src="/repasar-preguntas/script.js"></script>
  <script type="module" src="/assets/auth.js"></script>
</body>
