<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Premium - Examen AGE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
  <link rel="stylesheet" href="/asistente/style.css" />
</head>
<body>
    <div class="premium-chat-container">
        <!-- Cabecera Premium -->
        <div class="premium-header">
            <div class="avatar-bot">
                <div class="premium-badge">PREMIUM</div>
                <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Asistente Premium">
                <span class="pulse"></span>
            </div>
            <div class="header-info">
                <div class="titulo-chat">Asistente Premium Examen AGE</div>
                <div class="estado-enlinea">
                    <span>En línea</span>
                    <div class="status-indicator"></div>
                </div>
            </div>
            <div class="header-actions">
                <button id="history-toggle" class="action-btn" title="Historial de conversación">
                    <i class="fas fa-history"></i>
                </button>
                <button id="settings-toggle" class="action-btn" title="Personalizar tema">
                    <i class="fas fa-palette"></i>
                </button>
                <button id="clear-chat" class="action-btn" title="Limpiar conversación">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
        
        <!-- Panel de historial -->
        <div id="history-panel" class="history-panel">
            <div class="history-header">
                <h3>Historial de Conversaciones</h3>
                <button id="close-history" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="history-list">
                <!-- Se llenará dinámicamente con JS -->
            </div>
        </div>
        
        <!-- Área de mensajes con efecto glassmorphism -->
        <div id="chat-messages" class="premium-messages">
            <div class="welcome-message">
                <div class="avatar-bot-mini">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Asistente">
                </div>
                <div class="bubble-bot">
                    <h3>¡Hola! 👋 Soy tu asistente premium para los exámenes AGE</h3>
                    <p>Pregúntame cualquier duda sobre el proceso, estructura o temario. También puedo ayudarte con:</p>
                    <div class="quick-questions">
                        <button class="quick-btn">Estructura del examen</button>
                        <button class="quick-btn">Temario actualizado</button>
                        <button class="quick-btn">Consejos de estudio</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Barra de progreso -->
        <div id="typing-progress" class="typing-progress">
            <div class="progress-bar"></div>
        </div>
        
        <!-- Área de entrada premium -->
        <div class="premium-input-area">
            <div class="input-tools">
                <!-- Solo botón de voz -->
                <button id="voice-btn" class="tool-btn" title="Voz">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>
            <textarea id="chat-input" placeholder="Escribe tu pregunta..." rows="1"></textarea>
            <button id="chat-send" class="premium-send-btn" title="Enviar">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        
        <!-- Panel de personalización -->
        <div id="settings-panel" class="settings-panel">
            <div class="settings-header">
                <h3>Personalizar Asistente</h3>
                <button id="close-settings" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="settings-content">
                <div class="theme-option">
                    <h4>Tema de color:</h4>
                    <div class="theme-colors">
                        <div class="color-option active" data-theme="blue"></div>
                        <div class="color-option" data-theme="green"></div>
                        <div class="color-option" data-theme="purple"></div>
                        <div class="color-option" data-theme="red"></div>
                    </div>
                </div>
                <div class="theme-option">
                    <div class="switch-container">
                        <h4>Modo oscuro:</h4>
                        <label class="switch">
                            <input type="checkbox" id="dark-mode-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="theme-option">
                    <div class="switch-container">
                        <h4>Animaciones:</h4>
                        <label class="switch">
                            <input type="checkbox" id="animations-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
  <script src="/asistente/script.js"></script>
</body>
</html>
