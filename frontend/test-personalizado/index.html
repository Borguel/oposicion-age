<!DOCTYPE html>
<html lang="es">
<head>
  <script>if(location.hostname==="oposicion-age-1.onrender.com"){location.replace("https://www.dominatuopo.com"+location.pathname+location.search+location.hash);}</script>
  <style>html:not(.auth-listo) body { visibility: hidden; }</style>
  <script type="module" src="/assets/auth-guard.js"></script>
  <!-- Arranca la descarga del SDK de Firebase en paralelo con el resto
       de recursos de la página, sin esperar a que se evalúe auth.js --
       el import() dinámico de auth.js (protegido con try/catch, ver ese
       fichero) ya no se descubre solo con analizar el HTML como pasaba
       con un import estático, así que sin esta pista tardaba en
       arrancar hasta que auth.js terminaba de evaluar sus propios
       imports (medido: ~130ms de más antes de empezar la descarga). -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js" crossorigin />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js" crossorigin />
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffa633" />
  <title>Test Personalizado - Domina tu Opo</title>
  <meta name="description" content="Genera un test personalizado basado en el temario oficial del BOE, eligiendo tú los temas." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Test Personalizado - Domina tu Opo" />
  <meta property="og:description" content="Genera un test personalizado basado en el temario oficial del BOE, eligiendo tú los temas." />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://www.dominatuopo.com/test-personalizado/" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{if(localStorage.getItem("age-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/test-generator/style.css" />
  <link rel="stylesheet" href="/test-personalizado/style.css" />
</head>
<body>
<nav class="age-nav"></nav>

  <div class="container">
    <div class="test-type-container">
      <div class="test-type-card selected">
        <div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></div>
        <h1 class="title">Test Personalizado</h1>
        <div class="description">Basado en el temario oficial del BOE. Elige los temas que quieres repasar.</div>
      </div>
    </div>
    <div class="card fade-in" id="tarjeta-formulario">
      <form id="form-generar-test">
        <label for="num_preguntas">Número de preguntas:</label>
        <input type="number" id="num_preguntas" name="num_preguntas" min="1" max="100" value="10" required>
        <div class="timer-settings">
          <label>
            <input type="checkbox" id="modo_cronometrado"> <span>Activar modo examen cronometrado</span>
          </label>
          <div id="tiempo_cronometro" style="display: none;">
            <label for="minutos_cronometro">Tiempo (minutos):</label>
            <input type="number" id="minutos_cronometro" min="1" value="60">
          </div>
        </div>
        <label id="label-lista-temas">Selecciona uno o varios temas:</label>
        <div id="lista-temas"></div>
        <div class="reparto-preguntas" id="reparto-preguntas">
          <span class="reparto-preguntas-titulo">Reparto de preguntas entre los temas elegidos:</span>
          <label class="reparto-opcion">
            <input type="radio" name="modo_reparto" value="equitativo" checked>
            <span><strong>Equitativo</strong> — mismo número de preguntas por cada tema, sin importar su peso real en el examen.</span>
          </label>
          <label class="reparto-opcion">
            <input type="radio" name="modo_reparto" value="realista" id="opcion-reparto-realista">
            <span><strong>Según el examen real</strong> — más preguntas de los bloques que históricamente más caen, menos de los que casi no aparecen.</span>
          </label>
          <p class="reparto-opcion-nota" id="reparto-nota-sin-datos" style="display:none;">No disponible: esta oposición todavía no tiene exámenes oficiales cargados para calcularlo.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Generar test personalizado</button>
      </form>
    </div>
    <div id="temporizador" style="display:none;">
      <button type="button" id="btn-toggle-temporizador" class="btn-toggle-temporizador" aria-label="Ocultar temporizador" title="Ocultar temporizador"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <span id="temporizador-texto" class="icono-inline"></span>
    </div>
    <div id="barra-progreso-tiempo" class="progress-container" style="display: none;">
      <div id="progreso-tiempo" class="progress-bar" style="background: linear-gradient(90deg, #4caf50, #66bb6a);"></div>
      <div id="texto-progreso-tiempo" class="progress-text"></div>
    </div>
    <div id="navegador-preguntas" class="navegador-preguntas" style="display:none;"></div>
    <div id="contenedor-test" class="card fade-in" style="display:none;"></div>
    <div id="contenedor-resultados" class="fade-in" style="display:none;"></div>
    <div class="acciones-test-footer">
      <button id="btn-guardar-salir" type="button" class="btn-guardar-salir-estatico icono-inline" style="display:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 4v6h8V4"/><path d="M8 21v-7h8v7"/></svg> Guardar y salir</button>
      <button id="btn-finalizar" class="age-btn age-btn-danger-outline age-btn-block" style="display:none;">Finalizar Test</button>
    </div>
    <button id="btn-descargar-pdf" class="btn btn-secondary btn-block" style="display:none;">Descargar PDF del test</button>
  </div>

  <!-- Librerías externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module" src="/test-personalizado/script.js"></script>
  <script type="module" src="/assets/auth.js"></script>
</body>
</html>
