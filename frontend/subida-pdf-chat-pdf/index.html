<!DOCTYPE html>
<html lang="es">
<head>
  <script>if(location.hostname==="oposicion-age-1.onrender.com"){location.replace("https://www.dominatuopo.com"+location.pathname+location.search+location.hash);}</script>
  <style>html:not(.auth-listo) body { visibility: hidden; }</style>
  <script type="module" src="/assets/auth-guard.js"></script>
  <!-- Arranca la descarga del SDK de Firebase en paralelo con el resto
       de recursos de la página, sin esperar a que se evalúe auth.js --
       el import() dinámico de auth.js (protegido con try/catch, ver ese
       fichero) ya no se descubre solo con analizar el HTML como pasaba
       con un import estático, así que sin esta pista tardaba en
       arrancar hasta que auth.js terminaba de evaluar sus propios
       imports (medido: ~130ms de más antes de empezar la descarga). -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js" crossorigin />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js" crossorigin />
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffa633" />
  <title>Analizador de PDFs - Domina tu Opo</title>
  <meta name="description" content="Sube un PDF y pregúntale directamente con IA para entender su contenido." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Analizador de PDFs - Domina tu Opo" />
  <meta property="og:description" content="Sube un PDF y pregúntale directamente con IA para entender su contenido." />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://www.dominatuopo.com/subida-pdf-chat-pdf/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>try{if(localStorage.getItem("age-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/assets/pdf-tools.css" />
  <link rel="stylesheet" href="/subida-pdf-chat-pdf/style.css" />
</head>
<body>
<nav class="age-nav"></nav>

  <div class="pdfherr-header">
    <div class="pdfherr-icon" data-icon="chat" data-icon-size="32"></div>
    <h1>Chat con tu PDF</h1>
    <p>Pregúntale directamente a tu documento y obtén respuesta al momento, como si chatearas con alguien que se lo ha leído entero.</p>
  </div>

  <div class="pdfherr-body">
    <div class="chatpdf-shell">

      <div class="card chatpdf-upload-card" id="chatpdf-upload-card">
        <div class="card-header">
          <div class="card-icon" data-icon="documento" data-icon-size="20"></div>
          <h2 class="card-title">Sube tu documento</h2>
        </div>
        <p class="limite-paginas-nota hidden" id="limite-paginas-nota"></p>
        <div class="file-upload-area" id="pdf-upload-area">
          <div class="upload-icon" data-icon="documento" data-icon-size="28"></div>
          <h3>Arrastra tu PDF aquí</h3>
          <p>o haz clic para seleccionar un archivo</p>
          <input type="file" id="pdf-file" class="file-input" accept=".pdf" hidden>
          <button type="button" class="btn btn-primary" id="select-pdf-btn"><span data-icon="carpeta" data-icon-size="16"></span> Seleccionar PDF</button>
        </div>
        <p class="chatpdf-upload-hint" id="chatpdf-upload-status"></p>
      </div>

      <div class="card chatpdf-card hidden" id="chatpdf-card">
        <div class="chatpdf-docbar">
          <span class="chatpdf-docbar-icon" data-icon="documento" data-icon-size="18"></span>
          <div class="chatpdf-docbar-info">
            <span class="chatpdf-docbar-nombre" id="pdf-filename">Documento</span>
            <span class="chatpdf-docbar-meta"><span id="page-count">-</span> páginas</span>
          </div>
          <a class="chatpdf-docbar-cambiar" href="/mis-documentos/"><span data-icon="repetir" data-icon-size="14"></span><span class="chatpdf-docbar-cambiar-texto">Cambiar documento</span></a>
        </div>

        <div class="chatpdf-messages" id="pdf-chat-box"></div>

        <div class="chatpdf-input-row">
          <input type="text" id="pdf-user-input" placeholder="Haz una pregunta sobre el documento..." disabled>
          <button id="pdf-send-btn" disabled aria-label="Enviar pregunta"><span data-icon="reproducir" data-icon-size="18"></span></button>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="/assets/auth.js"></script>
  <script type="module" src="/subida-pdf-chat-pdf/script.js"></script>
  <script type="module">
    import { mostrarLimitePaginas } from "/assets/limite-paginas.js";
    mostrarLimitePaginas();
  </script>
</body>
</html>
