<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generar Test desde PDF - Oposición AGE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/assets/pdf-tools.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/subida-pdf-generar-test/style.css" />
</head>
<body>
<nav class="age-nav"></nav>

  <div class="pdfherr-header">
    <div class="pdfherr-icon">🧪</div>
    <h1 id="titulo-formulario">Generar Test desde PDF</h1>
    <p>Sube tu documento y ponte a prueba con un test generado por IA a partir de su contenido.</p>
  </div>

  <div class="pdfherr-body">
    <!-- Formulario PDF -->
    <div class="card fade-in" id="tarjeta-formulario">
      <div class="card-header">
        <div class="card-icon">⬆️</div>
        <h2 class="card-title">Subir Documento PDF</h2>
      </div>
      <form id="form-subir-pdf">
        <div class="form-group">
          <label for="archivo-pdf">📄 Sube tu documento PDF (máx. 10 MB)</label>
          <div class="file-upload-area" id="upload-area">
            <div class="upload-icon">⬆️</div>
            <div class="upload-text">
              <h3>Arrastra y suelta aquí tu PDF</h3>
              <p>o pincha para cargarlo</p>
            </div>
            <input type="file" id="archivo-pdf" accept=".pdf" class="file-input" required>
          </div>
          <div id="file-name" class="file-name"></div>
        </div>
        <div class="form-group">
          <label for="num_preguntas">Número de preguntas (1–50):</label>
          <input type="number" id="num_preguntas" min="1" max="50" value="10" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">✨ Generar Test desde PDF</button>
      </form>
    </div>

    <!-- Contenedor de carga -->
    <div id="contenedor-carga" class="card fade-in" style="display:none;">
      <div class="loading-container">
        <div class="ai-icon" id="ai-icon">🤖</div>
        <div class="mensaje-estado">
          <span id="texto-estado">Leyendo texto del PDF…</span>
        </div>
        <div class="barra-indeterminada"><div class="barra-indeterminada-fill"></div></div>
      </div>
    </div>

    <!-- Temporizador -->
    <div id="temporizador" style="display:none;"></div>

    <!-- Barra de progreso de preguntas -->
    <div id="barra-progreso-preguntas" class="progress-container" style="display:none;">
      <div id="progreso-preguntas" class="progress-bar"></div>
      <div id="texto-progreso-preguntas" class="progress-text"></div>
    </div>

    <!-- Contenedor de test -->
    <div id="contenedor-test" class="card fade-in" style="display:none;"></div>

    <!-- Resultados -->
    <div id="contenedor-resultados" class="fade-in" style="display:none;"></div>

    <!-- Botones finales -->
    <button id="btn-finalizar" class="btn btn-danger btn-full" style="display:none;">Finalizar Test</button>
    <button id="btn-descargar-pdf" class="btn btn-secondary btn-full" style="display:none;">Descargar PDF del test</button>
  </div>

  <script src="/subida-pdf-generar-test/script.js"></script>
  <script type="module" src="/assets/auth.js"></script>
</body>
</html>
