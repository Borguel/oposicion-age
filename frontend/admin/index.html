<!DOCTYPE html>
<html lang="es">
<head>
  <script>if(location.hostname==="oposicion-age-1.onrender.com"){location.replace("https://www.dominatuopo.com"+location.pathname+location.search+location.hash);}</script>
  <style>html:not(.auth-listo) body { visibility: hidden; }</style>
  <script type="module" src="/assets/auth-guard.js"></script>
  <!-- Arranca la descarga del SDK de Firebase en paralelo con el resto
       de recursos de la página, sin esperar a que se evalúe auth.js --
       el import() dinámico de auth.js (protegido con try/catch, ver ese
       fichero) ya no se descubre solo con analizar el HTML como pasaba
       con un import estático, así que sin esta pista tardaba en
       arrancar hasta que auth.js terminaba de evaluar sus propios
       imports (medido: ~130ms de más antes de empezar la descarga). -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js" crossorigin />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js" crossorigin />
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de administración - Domina tu Opo</title>
  <meta name="robots" content="noindex, nofollow" />
  <script>try{if(localStorage.getItem("age-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
<nav class="age-nav"></nav>

<main class="admin-root">
  <!-- Bloqueo si no es admin (además del backend, que es la barrera real) -->
  <div id="admin-no-autorizado" class="age-container admin-no-autorizado-wrap" style="display:none;">
    <div class="age-card admin-no-autorizado">
      <h2>Acceso restringido</h2>
      <p>Esta sección es solo para administradores.</p>
      <a class="age-btn age-btn-primary" href="/zona-opositor/">Volver a Zona opositor</a>
    </div>
  </div>

  <div id="admin-contenido" class="admin-shell" style="display:none;">
    <div class="admin-sidebar-overlay" id="admin-sidebar-overlay" hidden></div>

    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar-brand">
        <span class="admin-sidebar-logo" aria-hidden="true" data-icon="herramienta"></span>
        <span>Panel admin</span>
        <button type="button" class="admin-sidebar-cerrar" id="admin-sidebar-cerrar" aria-label="Cerrar menú" data-icon="cruz" data-icon-size="15"></button>
      </div>

      <nav class="admin-tabs" role="tablist">
        <button class="admin-tab active" data-grupo="dashboard" role="tab"><span class="admin-tab-ico" aria-hidden="true" data-icon="grafico"></span><span>Dashboard</span></button>

        <div class="admin-tab-grupo" data-grupo-contenedor="contenido">
          <button class="admin-tab admin-tab-grupo-toggle" data-grupo="contenido" role="tab" aria-expanded="false" aria-controls="admin-submenu-contenido">
            <span class="admin-tab-ico" aria-hidden="true" data-icon="libros"></span><span>Contenido</span>
            <span class="admin-tab-chevron" aria-hidden="true">›</span>
          </button>
          <div class="admin-submenu" id="admin-submenu-contenido" hidden></div>
        </div>

        <div class="admin-tab-grupo" data-grupo-contenedor="usuarios">
          <button class="admin-tab admin-tab-grupo-toggle" data-grupo="usuarios" role="tab" aria-expanded="false" aria-controls="admin-submenu-usuarios">
            <span class="admin-tab-ico" aria-hidden="true" data-icon="usuarios"></span><span>Usuarios</span>
            <span class="admin-tab-badge" id="badge-reportes" hidden>0</span>
            <span class="admin-tab-chevron" aria-hidden="true">›</span>
          </button>
          <div class="admin-submenu" id="admin-submenu-usuarios" hidden></div>
        </div>

        <button class="admin-tab" data-grupo="boe" role="tab" id="tab-boe" hidden><span class="admin-tab-ico" aria-hidden="true" data-icon="edificio"></span><span>Vigilancia BOE</span><span class="admin-tab-badge" id="badge-boe" hidden>0</span></button>

        <div class="admin-tab-grupo" data-grupo-contenedor="configuracion">
          <button class="admin-tab admin-tab-grupo-toggle" data-grupo="configuracion" role="tab" aria-expanded="false" aria-controls="admin-submenu-configuracion">
            <span class="admin-tab-ico" aria-hidden="true" data-icon="ajustes"></span><span>Configuración</span>
            <span class="admin-tab-chevron" aria-hidden="true">›</span>
          </button>
          <div class="admin-submenu" id="admin-submenu-configuracion" hidden></div>
        </div>
      </nav>

      <a href="/zona-opositor/" class="admin-sidebar-salir"><span aria-hidden="true">←</span> Volver a la web</a>
    </aside>

    <div class="admin-content">
      <header class="admin-header">
        <button type="button" class="admin-menu-btn" id="admin-menu-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="admin-sidebar">
          <span></span><span></span><span></span>
        </button>
        <h1 id="admin-titulo">Dashboard</h1>
        <div class="admin-header-op">
          <label for="admin-oposicion">Gestionando</label>
          <select id="admin-oposicion" class="age-input admin-oposicion" aria-label="Oposición que se gestiona">
            <option value="AGE">AGE</option>
            <option value="GACE">GACE</option>
            <option value="AUXILIAR">Auxiliar</option>
            <option value="METRO">Metro</option>
          </select>
        </div>
      </header>

      <div class="admin-content-inner">
        <div class="admin-subtabs" id="admin-subtabs" hidden></div>
        <section id="panel-dashboard" class="admin-panel"></section>
        <section id="panel-temario" class="admin-panel" hidden></section>
        <section id="panel-preguntas" class="admin-panel" hidden></section>
        <section id="panel-analitica" class="admin-panel" hidden></section>
        <section id="panel-usuarios" class="admin-panel" hidden></section>
        <section id="panel-ingresos" class="admin-panel" hidden></section>
        <section id="panel-reportes" class="admin-panel" hidden></section>
        <section id="panel-boe" class="admin-panel" hidden></section>
        <section id="panel-bajas" class="admin-panel" hidden></section>
        <section id="panel-limites" class="admin-panel" hidden></section>
        <section id="panel-auditoria" class="admin-panel" hidden></section>
        <section id="panel-sistema" class="admin-panel" hidden></section>
      </div>
    </div>
  </div>
</main>

<!-- Avisos flotantes (toasts) -->
<div id="admin-toasts" class="admin-toasts" aria-live="polite"></div>

<!-- Modal genérico (crear/editar pregunta, detalle de usuario) -->
<div id="admin-modal" class="admin-modal" role="dialog" aria-modal="true" hidden>
  <div class="admin-modal-caja age-card">
    <button type="button" class="admin-modal-cerrar" id="admin-modal-cerrar" aria-label="Cerrar" data-icon="cruz" data-icon-size="15"></button>
    <div id="admin-modal-contenido"></div>
  </div>
</div>

<script type="module" src="/admin/script.js"></script>
<script type="module" src="/assets/auth.js"></script>
</body>
</html>
