<!DOCTYPE html>
<html lang="es">
<head>
  <script>if(location.hostname==="oposicion-age-1.onrender.com"){location.replace("https://www.dominatuopo.com"+location.pathname+location.search+location.hash);}</script>
  <style>html:not(.auth-listo) body { visibility: hidden; }</style>
  <script type="module" src="/assets/auth-guard.js"></script>
  <!-- Arranca la descarga del SDK de Firebase en paralelo con el resto
       de recursos de la página, sin esperar a que se evalúe auth.js --
       el import() dinámico de auth.js (protegido con try/catch, ver ese
       fichero) ya no se descubre solo con analizar el HTML como pasaba
       con un import estático, así que sin esta pista tardaba en
       arrancar hasta que auth.js terminaba de evaluar sus propios
       imports (medido: ~130ms de más antes de empezar la descarga). -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js" crossorigin />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js" crossorigin />
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffa633" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu Tutor - Domina tu Opo</title>
  <meta name="description" content="Tu Tutor: resuelve dudas sobre el temario y el proceso selectivo de tu oposición con IA." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tu Tutor - Domina tu Opo" />
  <meta property="og:description" content="Tu Tutor: resuelve dudas sobre el temario y el proceso selectivo de tu oposición con IA." />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://www.dominatuopo.com/tu-tutor/" />
    <script>try{if(localStorage.getItem("age-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <link rel="stylesheet" href="/assets/theme.css" />

  <link rel="stylesheet" href="/tu-tutor/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js" integrity="sha384-nLoOnA/BDh8A/jxqtckg4DumuCGOBYUnNJLZdQz/zfYNp3wcjGSoWTAzgko06G/2" crossorigin="anonymous"></script>
</head>
<body>
<nav class="age-nav"></nav>

<div class="tutor-container" id="tutor-container" role="application" aria-label="Chat con Tu Tutor">
  <h1 class="sr-only">Tu Tutor - Asistente de estudio con IA</h1>
  <!-- Sidebar (historial) -->
  <div class="tutor-sidebar" id="chat-sidebar" role="region" aria-label="Historial de conversaciones">
    <h3>Conversaciones</h3>
    <button type="button" id="nueva-conversacion-btn" class="btn-nueva-conversacion">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nueva conversación
    </button>
    <ul id="chat-history" role="list"></ul>
    <div class="sidebar-bottom-actions">
      <button id="salir-del-chat-sidebar" class="btn-salir-sidebar" aria-label="Volver a Zona Opositor">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver a Zona Opositor
      </button>
    </div>
  </div>
  <!-- Hermano de .tutor-sidebar (no hijo): si estuviera anidado dentro,
       al ser position:fixed a pantalla completa se pintaría encima de la
       propia lista de conversaciones y bloquearía los clics sobre ella. -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Contenido principal -->
  <div class="tutor-box">
    <div class="tutor-header" role="banner">
      <button id="toggle-sidebar" aria-label="Abrir historial" class="btn-menu-historial" title="Historial">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="avatar-bot">
        <img src="/assets/tutor-avatar.svg" alt="Tu Tutor" width="42" height="42" />
        <span class="pulse" aria-hidden="true"></span>
      </div>
      <div class="header-info">
        <div class="titulo-chat">Tu Tutor <span class="premium-badge">Premium</span></div>
        <div class="estado-enlinea">En línea</div>
      </div>
      <button id="cerrar-chat-total" class="btn-icono-header" aria-label="Cerrar chat y volver a Zona Opositor" title="Cerrar">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div id="chat-messages" class="tutor-messages" role="log" aria-live="polite">
      <div class="welcome-message">
        <div class="avatar-bot-mini">
          <img src="/assets/tutor-avatar.svg" alt="Tu Tutor" width="26" height="26" />
        </div>
        <div class="bubble-bot">
          <h3 class="welcome-saludo"><span data-icon="mano" data-icon-size="20"></span> <span class="welcome-saludo-texto">¡Hola! Soy Tu Tutor</span></h3>
          <p class="welcome-mensaje">Pregúntame cualquier duda sobre el temario o el proceso selectivo. También puedo ayudarte con:</p>
          <div class="welcome-accion"></div>
          <div class="quick-questions">
            <button type="button" class="quick-btn">Estructura del examen</button>
            <button type="button" class="quick-btn">Temario actualizado</button>
            <button type="button" class="quick-btn">Consejos de estudio</button>
          </div>
        </div>
      </div>
    </div>

    <div id="typing-indicator" class="typing-indicator" style="display: none;">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <button type="button" id="scroll-to-bottom" class="btn-scroll-abajo" aria-label="Ir al último mensaje" title="Ir al último mensaje" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </button>

    <div class="input-area-pro" id="chat-input-container">
      <textarea id="chat-input" placeholder="Escribe tu pregunta..." rows="1" aria-label="Escribe tu mensaje"></textarea>
      <button id="chat-send" class="btn-enviar" aria-label="Enviar mensaje" title="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M12 5l-6 6M12 5l6 6"/>
        </svg>
      </button>
    </div>
  </div>
</div>
<script type="module" src="/tu-tutor/script.js"></script>
  <script type="module" src="/assets/auth.js"></script>
</body>
</html>
