<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta - Oposición AGE</title>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/mi-cuenta/style.css" />
</head>
<body>
  <nav class="age-nav"></nav>

  <div class="cuenta-header">
    <div class="age-container">
      <h1>Mi cuenta</h1>
      <p>Gestiona tus oposiciones, tu suscripción y tus datos personales.</p>
    </div>
  </div>

  <div class="age-container cuenta-layout">
    <aside class="cuenta-aside">
      <div class="age-card cuenta-perfil-card">
        <div id="cuenta-avatar" class="cuenta-avatar">?</div>
        <div id="cuenta-email" class="cuenta-email">Cargando…</div>
        <button type="button" id="btn-logout" class="age-btn age-btn-outline age-btn-block">Cerrar sesión</button>
      </div>

    </aside>

    <main class="cuenta-main">
      <a href="/zona-opositor/" class="cuenta-volver-zona">← Volver a tu zona de estudio</a>

      <section class="age-card cuenta-section">
        <div class="cuenta-section-titulo">
          <h2>Mis oposiciones</h2>
          <a href="/planes/" class="age-btn age-btn-primary cuenta-btn-contratar">+ Contratar otra oposición</a>
        </div>
        <div id="cuenta-oposiciones" class="cuenta-oposiciones">Cargando…</div>
        <button type="button" id="btn-portal" class="age-btn age-btn-outline age-btn-block cuenta-btn-portal">Gestionar facturación y suscripciones</button>
      </section>

      <section class="age-card cuenta-section">
        <h2>Datos personales</h2>
        <div class="cuenta-datos-resumen">
          <div class="cuenta-datos-fila"><span>Nombre</span><strong id="resumen-nombre">—</strong></div>
          <div class="cuenta-datos-fila"><span>Apellidos</span><strong id="resumen-apellidos">—</strong></div>
          <div class="cuenta-datos-fila"><span>Teléfono</span><strong id="resumen-telefono">—</strong></div>
          <div class="cuenta-datos-fila"><span>Correo electrónico</span><strong id="resumen-email">—</strong></div>
          <div class="cuenta-datos-fila"><span>Dirección</span><strong id="resumen-direccion">—</strong></div>
        </div>
        <a href="/mi-cuenta/datos-personales/" class="age-btn age-btn-primary">✏️ Modificar datos personales</a>
      </section>
    </main>
  </div>

  <script type="module" src="/assets/auth.js"></script>
  <script type="module" src="/mi-cuenta/script.js"></script>
</body>
</html>
