<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta - Oposición AGE</title>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/mi-cuenta/style.css" />
</head>
<body>
  <nav class="age-nav"></nav>

  <div class="cuenta-header">
    <div class="age-container">
      <h1>Mi cuenta</h1>
      <p>Gestiona tus oposiciones, tu suscripción y tus datos personales.</p>
    </div>
  </div>

  <div class="age-container cuenta-layout">
    <aside class="cuenta-aside">
      <div class="age-card cuenta-perfil-card">
        <div id="cuenta-avatar" class="cuenta-avatar">?</div>
        <div id="cuenta-email" class="cuenta-email">Cargando…</div>
        <button type="button" id="btn-logout" class="age-btn age-btn-outline age-btn-block">Cerrar sesión</button>
      </div>

      <div class="age-card cuenta-accesos-card">
        <a class="cuenta-acceso-link" href="/mis-tests/">
          <span class="cuenta-acceso-icono">🧪</span>
          <span>Mis tests</span>
        </a>
        <a class="cuenta-acceso-link" href="/mis-documentos/">
          <span class="cuenta-acceso-icono">📚</span>
          <span>Mis documentos</span>
        </a>
      </div>
    </aside>

    <main class="cuenta-main">
      <section class="age-card cuenta-racha-card">
        <div class="cuenta-racha-icono" id="racha-icono">🔥</div>
        <div class="cuenta-racha-info">
          <div class="cuenta-racha-numero"><span id="racha-numero">0</span> día<span id="racha-plural">s</span> seguidos</div>
          <div class="cuenta-racha-mensaje" id="racha-mensaje">Cargando tu racha de estudio…</div>
          <div class="cuenta-racha-maxima" id="racha-maxima" style="display:none;"></div>
        </div>
      </section>

      <section class="age-card cuenta-section">
        <div class="cuenta-section-titulo">
          <h2>Mis oposiciones</h2>
          <a href="/planes/" class="age-btn age-btn-primary cuenta-btn-contratar">+ Contratar otra oposición</a>
        </div>
        <div id="cuenta-oposiciones" class="cuenta-oposiciones">Cargando…</div>
        <button type="button" id="btn-portal" class="age-btn age-btn-outline age-btn-block cuenta-btn-portal">Gestionar facturación y suscripciones</button>
      </section>

      <section class="age-card cuenta-section">
        <h2>Datos personales</h2>
        <form id="form-datos" class="cuenta-form">
          <div class="cuenta-form-grid">
            <div class="cuenta-campo">
              <label for="datos-nombre">Nombre</label>
              <input type="text" id="datos-nombre" autocomplete="given-name" placeholder="Tu nombre" />
            </div>
            <div class="cuenta-campo">
              <label for="datos-apellidos">Apellidos</label>
              <input type="text" id="datos-apellidos" autocomplete="family-name" placeholder="Tus apellidos" />
            </div>
            <div class="cuenta-campo">
              <label for="datos-telefono">Teléfono</label>
              <input type="tel" id="datos-telefono" autocomplete="tel" placeholder="600 000 000" />
            </div>
            <div class="cuenta-campo cuenta-campo-full">
              <label for="datos-direccion">Dirección</label>
              <input type="text" id="datos-direccion" autocomplete="street-address" placeholder="Calle, número, ciudad" />
            </div>
          </div>

          <div id="datos-mensaje" class="datos-mensaje" style="display:none;"></div>

          <button type="submit" class="age-btn age-btn-primary" id="btn-guardar-datos">Guardar cambios</button>
        </form>
      </section>
    </main>
  </div>

  <script type="module" src="/assets/auth.js"></script>
  <script type="module" src="/mi-cuenta/script.js"></script>
</body>
</html>
