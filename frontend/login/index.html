<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - Oposición AGE</title>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/login/style.css" />
</head>
<body>
  <nav class="age-nav">
    <a href="/" class="age-nav-home">🏠 Inicio</a>
    <a href="/subida-pdf-pagina-principal/">📄 Herramientas PDF</a>
    <a href="/test-generator/">📝 Generador de Test</a>
    <a href="/subida-pdf-generar-test/">📄➜📝 Test desde PDF</a>
    <a href="/subida-pdf-tarjetas/">🗂️ Tarjetas</a>
    <a href="/subida-pdf-esquemas/">🧩 Esquemas</a>
    <a href="/subida-pdf-resumen/">📑 Resumen</a>
    <a href="/subida-pdf-chat-pdf/">💬 Analizar PDF</a>
    <a href="/repetir-test/">🔁 Repetir Test</a>
    <a href="/preguntas-falladas/">❌ Falladas</a>
    <a href="/estadisticas/">📊 Estadísticas</a>
    <a href="/chat-ai/">🤖 Chat IA</a>
    <a href="/asistente/">🧑‍💼 Asistente</a>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-tabs">
        <button type="button" id="tab-login" class="login-tab active">Iniciar sesión</button>
        <button type="button" id="tab-signup" class="login-tab">Crear cuenta</button>
      </div>

      <form id="form-auth">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6" />

        <div id="mensaje-error" class="mensaje-error" style="display:none;"></div>

        <button type="submit" class="btn-primary" id="btn-submit">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/auth.js"></script>
  <script type="module" src="/login/script.js"></script>
</body>
</html>
