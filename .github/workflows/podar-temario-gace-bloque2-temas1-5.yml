name: Podar temario GACE bloque_02 temas 1-5 (TUE/TFUE) a solo lo relevante

# Reduce los subbloques de "Temario GACE"/bloque_02, temas 1-5 (subidos con
# el articulado completo de TUE/TFUE por cargar_temario_gace_bloque2_ue.py)
# a solo los artículos realmente relevantes a cada tema: naturaleza jurídica,
# instituciones, fuentes del Derecho y subsidiariedad. No toca tema_06
# (fichas FTU, ya bien acotado). Se dispara a mano porque reescribe (borra y
# recrea) los subbloques de esos 5 temas en Firestore.
#
# Ejecuta primero con accion=preview (no toca Firestore, solo genera
# preview_podar_gace_bloque2_temas1_5.json y un resumen en el log) y revisa
# el resultado antes de volver a ejecutar con accion=subir.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "preview (solo genera el informe) o subir (sube de verdad a Firestore)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - subir

jobs:
  podar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Podar temario GACE bloque_02 (temas 1-5)
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python podar_temario_gace_bloque2_temas1_5.py --${{ github.event.inputs.accion }}

      - name: Guardar vista previa como artefacto
        if: github.event.inputs.accion == 'preview'
        uses: actions/upload-artifact@v7
        with:
          name: preview-podar-gace-bloque2-temas1-5
          path: preview_podar_gace_bloque2_temas1_5.json
