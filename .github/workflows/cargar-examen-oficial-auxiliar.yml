name: Cargar examen oficial AUXILIAR a Firestore

# Sube a Firestore las preguntas de un examen oficial del Cuerpo General
# Auxiliar de la Administración del Estado ya transcritas en
# datos_examenes/auxiliar_<anio>_ejercicio_unico.json (+ _explicaciones.json y,
# opcionalmente, _temas.json), usando cargar_examen_oficial_auxiliar.py y
# etiquetar_temas_examenes_auxiliar.py. Se dispara a mano (sin credenciales en
# el repo ni en el chat: la clave de Firebase vive solo en el secreto
# FIREBASE_CREDENTIALS_JSON de este repositorio) por el mismo motivo que
# cargar-examen-oficial-age.yml: el sandbox de desarrollo no tiene
# clave-firebase.json a mano.
on:
  workflow_dispatch:
    inputs:
      anio:
        description: "Identificador del examen (debe existir datos_examenes/auxiliar_<anio>_ejercicio_unico.json), p. ej. 2024 o 2025"
        required: true
        default: "2025"
      etiquetar_temas:
        description: "Etiquetar también con tema_id tras la carga (requiere auxiliar_<anio>_ejercicio_unico_temas.json)"
        required: true
        default: true
        type: boolean

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cargar preguntas del examen
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python cargar_examen_oficial_auxiliar.py "${{ github.event.inputs.anio }}"

      - name: Etiquetar preguntas con tema_id
        if: ${{ github.event.inputs.etiquetar_temas == 'true' }}
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python etiquetar_temas_examenes_auxiliar.py "${{ github.event.inputs.anio }}"
