name: Recordatorio de fin de prueba gratuita

on:
  schedule:
    # 19:00 UTC todos los días, mismo horario que el recordatorio de racha.
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  enviar-recordatorios:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al backend
        run: |
          curl -sS -X POST "${{ vars.BACKEND_URL || 'https://oposicion-age.onrender.com' }}/tareas/recordatorios-prueba" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET_KEY }}" \
            --fail-with-body
