name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint (informativo, no bloquea el PR)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.txt
          npm install

      - name: ruff (Python)
        continue-on-error: true
        run: ruff check .

      - name: black (Python)
        continue-on-error: true
        run: black --check .

      - name: prettier (frontend)
        continue-on-error: true
        run: npx prettier --check "frontend/**/*.{js,css,html}"

  security:
    name: Seguridad (bandit + pip-audit, bloquea el PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # Separado del job "lint" (informativo) el 20/08/2026, tras una
      # auditoría externa: bandit y pip-audit ya habían encontrado 3 CVEs
      # reales y una excepción silenciosa antes de esto, pero con
      # continue-on-error nunca bloqueaban un PR -- el hallazgo se escribía
      # en el resumen del job y se podía fusionar igual sin que nadie lo
      # viera. ruff/black/prettier siguen en "lint" como informativos (son
      # de estilo, no de seguridad).
      - name: bandit (seguridad, Python)
        run: bandit -r . -c pyproject.toml

      - name: pip-audit (vulnerabilidades conocidas en dependencias)
        run: pip-audit -r requirements.txt

  lighthouse:
    name: Lighthouse (informativo, no bloquea el PR)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Servir el frontend estático
        run: |
          python3 -m http.server 8123 --directory frontend &
          for i in $(seq 1 20); do curl -sSf http://localhost:8123/ > /dev/null && break; sleep 0.5; done

      # Umbrales pendientes: esto es informativo mientras cogemos un
      # historial real de puntuaciones en PRs (ver SECURITY.md/ronda de
      # infraestructura, agosto 2026) -- lo endurecemos a bloqueante más
      # adelante con datos reales en vez de un umbral inventado hoy.
      - name: Ejecutar Lighthouse sobre páginas públicas clave
        run: |
          mkdir -p lighthouse-reports
          echo "## Lighthouse (informativo, no bloquea el PR)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Página | Performance | Accessibility | Best Practices | SEO |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          declare -A paginas=(
            [home]="/"
            [planes]="/planes/"
            [login]="/login/"
            [demo]="/demo/"
            [oposicion-gace]="/oposicion-gace/"
          )
          for nombre in "${!paginas[@]}"; do
            ruta="${paginas[$nombre]}"
            npx --yes lighthouse@13.4.1 "http://localhost:8123${ruta}" \
              --output=json --output-path="lighthouse-reports/${nombre}.json" \
              --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --quiet
            node -e "
              const r = require('./lighthouse-reports/${nombre}.json');
              const s = (k) => Math.round(r.categories[k].score * 100);
              console.log(\`| ${nombre} | \${s('performance')} | \${s('accessibility')} | \${s('best-practices')} | \${s('seo')} |\`);
            " >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Guardar informes completos de Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports/

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Comprobar que todos los ficheros Python compilan
        run: python -m compileall -q .

      # --cov-fail-under NO se pone a propósito: esto es solo visibilidad
      # (saber de verdad dónde están los huecos, ver auditoría de agosto de
      # 2026), no un umbral que bloquee el PR. Un fallo real de test sigue
      # bloqueando igual, eso no cambia -- pytest-cov no toca ese comportamiento.
      - name: Ejecutar tests (con cobertura, informativa)
        run: python -m pytest -v --cov=. --cov-report=term-missing

      - name: Publicar el resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura de tests (informativa, no bloquea el PR)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Comprobar sintaxis de todo el JS del frontend
        run: |
          find frontend -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Instalar dependencias de test
        run: npm install

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests end-to-end del frontend
        run: npx playwright test
