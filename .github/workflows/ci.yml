name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint (informativo, no bloquea el PR)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.txt
          npm install

      - name: ruff (Python)
        run: ruff check .

      - name: black (Python)
        run: black --check .

      - name: prettier (frontend)
        run: npx prettier --check "frontend/**/*.{js,css,html}"

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Comprobar que todos los ficheros Python compilan
        run: python -m compileall -q .

      - name: Ejecutar tests
        run: python -m pytest -v

  frontend:
    name: Frontend (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar sintaxis de todo el JS del frontend
        run: |
          find frontend -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Instalar dependencias de test
        run: npm install

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests end-to-end del frontend
        run: npx playwright test
