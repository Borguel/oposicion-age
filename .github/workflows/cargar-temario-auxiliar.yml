name: Cargar temario Auxiliar (Bloque I) a Firestore

# Carga el Bloque I ("Organización Pública", 16 temas) de "Temario Auxiliar"
# desde BOE-435_Normativa_para_ingreso_en_el_Cuerpo_General_Auxiliar_de_la_
# Administracion_del_Estado.pdf, vía cargar_temario_auxiliar.py. Se dispara
# a mano porque el sandbox de desarrollo no tiene salida a api.deepseek.com
# (política de red del proxy), y este runner de GitHub Actions sí tiene
# acceso normal a internet -- mismo motivo que ya tiene
# subir-datos-convocatoria.yml para no necesitar un ordenador con
# clave-firebase.json a mano.
#
# Ejecuta primero con accion=preview (no toca Firestore, solo genera
# preview_temario_auxiliar.json y un resumen por tema en el log) y revisa
# el resultado antes de volver a ejecutar con accion=subir.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "preview (solo genera el informe) o subir (clasifica y sube de verdad a Firestore)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - subir

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cargar temario Auxiliar (Bloque I)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python cargar_temario_auxiliar.py --${{ github.event.inputs.accion }}

      - name: Guardar vista previa como artefacto
        if: github.event.inputs.accion == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview-temario-auxiliar
          path: preview_temario_auxiliar.json
