name: Podar temario AGE bloque_05/tema_06 (LGP) a solo lo relevante

# Reduce los subbloques de "Temario AGE"/bloque_05/tema_06 (subidos enteros
# por completar_temario_age_bloques_4_5.py) a solo los artículos de la Ley
# General Presupuestaria realmente relevantes para "Gestión económica y
# financiera de los contratos del sector público": procedimiento ADOP,
# gastos plurianuales y función interventora. Se dispara a mano porque
# reescribe (borra y recrea) los subbloques de ese tema en Firestore.
#
# Ejecuta primero con accion=preview (no toca Firestore, solo genera
# preview_podar_age_bloque5_tema6.json y un resumen en el log) y revisa el
# resultado antes de volver a ejecutar con accion=subir.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "preview (solo genera el informe) o subir (sube de verdad a Firestore)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - subir

jobs:
  podar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Podar temario AGE bloque_05/tema_06
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python podar_temario_age_bloque5_tema6.py --${{ github.event.inputs.accion }}

      - name: Guardar vista previa como artefacto
        if: github.event.inputs.accion == 'preview'
        uses: actions/upload-artifact@v7
        with:
          name: preview-podar-age-bloque5-tema6
          path: preview_podar_age_bloque5_tema6.json
