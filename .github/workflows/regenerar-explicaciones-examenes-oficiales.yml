name: Regenerar explicaciones de exámenes oficiales

# Regenera el campo "explicacion" de las preguntas de exámenes oficiales
# (AGE, AUXILIAR, GACE) cuya explicación no repasa las 4 opciones -- solo
# justifica la correcta, a diferencia de Test Personalizado (ver
# regenerar_explicaciones_examenes_oficiales.py para el porqué).
#
# Se lanza a mano. Por defecto solo AUDITA (no escribe): cuenta cuántas
# preguntas hay pendientes por oposición y genera 2-3 ejemplos reales de
# antes/después. Pon "modo" = aplicar para regenerar de verdad. Las claves
# viven solo en los secretos FIREBASE_CREDENTIALS_JSON/DEEPSEEK_API_KEY de
# este repositorio (mismo patrón que reasignar-temas-examenes.yml).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        required: true
        default: "auditar"
        type: choice
        options:
          - auditar   # solo lectura: cuenta pendientes + ejemplos antes/después
          - aplicar   # regenera de verdad las explicaciones pendientes

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Auditar / regenerar explicaciones
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            aplicar) python regenerar_explicaciones_examenes_oficiales.py --aplicar ;;
            *)       python regenerar_explicaciones_examenes_oficiales.py ;;
          esac
