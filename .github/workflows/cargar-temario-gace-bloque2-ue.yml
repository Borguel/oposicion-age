name: Cargar temario GACE (Bloque II, Unión Europea) a Firestore

# Carga el Bloque II ("Unión Europea", 6 temas) de "Temario GACE" desde los
# PDFs ya subidos al repo en temario-fuentes/ (los Tratados TUE/TFUE y las 23
# fichas temáticas oficiales del Parlamento Europeo), vía
# cargar_temario_gace_bloque2_ue.py. Se dispara a mano porque el sandbox de
# desarrollo no tiene salida a api.deepseek.com (política de red del proxy),
# y este runner de GitHub Actions sí tiene acceso normal a internet -- mismo
# motivo que ya tienen cargar-temario-auxiliar.yml y
# cargar-temario-auxiliar-bloque2.yml.
#
# Ejecuta primero con accion=preview (no toca Firestore, solo genera
# preview_temario_gace_bloque2_ue.json y un resumen por tema en el log) y
# revisa el resultado antes de volver a ejecutar con accion=subir.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "preview (solo genera el informe) o subir (clasifica con DeepSeek y sube de verdad a Firestore)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - subir

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cargar temario GACE (Bloque II, Unión Europea)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python cargar_temario_gace_bloque2_ue.py --${{ github.event.inputs.accion }}

      - name: Guardar vista previa como artefacto
        if: github.event.inputs.accion == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview-temario-gace-bloque2-ue
          path: preview_temario_gace_bloque2_ue.json
