name: Comprobación de salud del backend

# El disparo automático cada 10 minutos (cron) se ha quitado a propósito
# (06/08/2026): un ping periódico a /health no necesita gastar minutos de
# Actions de un repo privado -- ese cupo es limitado y este workflow, solo
# por sí solo, disparaba ~144 ejecuciones/día. El keep-alive del backend
# en el plan gratuito de Render (que lo duerme tras un rato sin
# peticiones) y el aviso si cae ahora los hace un servicio externo
# gratuito (UptimeRobot o cron-job.org) pegando a
# https://oposicion-age.onrender.com/health cada 5-10 minutos, sin
# consumir nada de esta cuenta de GitHub. Se deja workflow_dispatch para
# poder lanzar la comprobación a mano si hace falta depurar algo.
on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /health
        run: |
          curl -sS --max-time 90 --fail-with-body \
            "${{ vars.BACKEND_URL || 'https://oposicion-age.onrender.com' }}/health"
