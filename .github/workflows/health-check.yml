name: Comprobación de salud del backend

on:
  schedule:
    # Cada 10 minutos: además de servir de monitor de disponibilidad (si
    # este workflow falla, GitHub avisa por email automáticamente al dueño
    # del repositorio), mantiene "despierto" el backend en el plan gratuito
    # de Render, que lo duerme tras un rato sin peticiones. En la práctica,
    # GitHub retrasa bastante el disparo de "schedule" en repos con poca
    # actividad (huecos reales de ~1h en vez de 10 min), así que Render
    # puede llegar a dormirse entre comprobaciones -- por eso el timeout de
    # abajo tiene que aguantar un arranque en frío completo, no solo un
    # backend ya despierto.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /health
        run: |
          curl -sS --max-time 90 --fail-with-body \
            "${{ vars.BACKEND_URL || 'https://oposicion-age.onrender.com' }}/health"
