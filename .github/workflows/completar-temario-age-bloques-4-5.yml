name: Completar temario AGE (bloques 4 y 5) a Firestore

# Rellena los 2 temas de "Temario AGE" que estaban vacíos (bloque_04/tema_09
# y bloque_05/tema_06) a partir de los Códigos BOE consolidados subidos al
# repo en Continuacion-temario-AGE/, vía completar_temario_age_bloques_4_5.py.
# Se dispara a mano porque el sandbox de desarrollo no tiene salida a
# openaipublic.blob.core.windows.net (tiktoken, política de red del proxy),
# y este runner de GitHub Actions sí tiene acceso normal a internet.
#
# Ejecuta primero con accion=preview (no toca Firestore, solo genera
# preview_temario_age_bloques_4_5.json y un resumen en el log) y revisa el
# resultado antes de volver a ejecutar con accion=subir.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "preview (solo genera el informe) o subir (sube de verdad a Firestore)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - subir

jobs:
  completar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Completar temario AGE (bloques 4 y 5)
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python completar_temario_age_bloques_4_5.py --${{ github.event.inputs.accion }}

      - name: Guardar vista previa como artefacto
        if: github.event.inputs.accion == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview-temario-age-bloques-4-5
          path: preview_temario_age_bloques_4_5.json
