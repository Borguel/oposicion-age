services:
  - type: web
    name: oposicion-age
    env: python
    plan: free
    # Corre la suite de tests como parte del propio build: si algo falla,
    # el build falla y Render mantiene desplegada la versión anterior en
    # vez de sustituirla por una rota (antes, Render redesplegaba en cada
    # push sin que el resultado de los tests tuviera ninguna influencia).
    # requirements-dev.txt ya incluye "-r requirements.txt", así que
    # instala todo lo necesario en un solo paso.
    buildCommand: pip install -r requirements-dev.txt && python -m pytest -q
    # Antes "python app.py" (servidor de desarrollo de Flask/Werkzeug,
    # threaded=True) -- sin proceso maestro ni timeout propio, una petición
    # realmente atascada podía dejar sin respuesta a TODA la web (ver el
    # aviso que ya dejaba app.py sobre esto mismo). gunicorn con workers de
    # hilos (gthread) sí vigila y reinicia un worker que deje de responder.
    #
    # --workers 1 a propósito, no por límite técnico: tanto el limiter de
    # peticiones por IP (Limiter(storage_uri="memory://") en app.py) como
    # el tope de llamadas simultáneas a DeepSeek (_semaforo_deepseek en
    # deepseek_utils.py) son estado en memoria de UN solo proceso -- con
    # 2+ workers, cada uno tendría su propia copia y ambos límites se
    # volverían N veces más permisivos sin que nadie lo note. Subir
    # --workers en el futuro exige antes mover esas dos cosas a un backend
    # compartido (p. ej. Redis).
    #
    # --threads 16: punto de partida (sin datos de pico de concurrencia
    # real todavía) para varias peticiones cortas más varias conexiones SSE
    # de generación larga a la vez, con un número acotado de hilos en vez
    # de la creación sin límite del servidor de desarrollo.
    #
    # --timeout 300 (5 min): con gthread este timeout es del WORKER, no de
    # cada petición individual (el worker sigue "vivo" mientras cualquiera
    # de sus hilos esté trabajando) -- se deja generoso a propósito porque
    # el coste de un timeout demasiado bajo es asimétrico: mataría el
    # worker entero (cortando TODAS las conexiones que estuviera
    # atendiendo en ese momento, de cualquier usuario) justo en el peor
    # momento (mucha carga). Si algún día aparece "WORKER TIMEOUT" en los
    # logs de Render, la señal es subirlo más, no bajarlo -- ninguna
    # llamada individual a DeepSeek puede colgarse más de ~94s (ver
    # deepseek_utils.py), así que un worker sano nunca debería necesitar
    # tanto margen en circunstancias normales.
    startCommand: gunicorn app:app --worker-class gthread --workers 1 --threads 16 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_BASICO
        sync: false
      - key: STRIPE_PRICE_ID_PREMIUM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NOMBRE
        sync: false
      - key: BREVO_TEMPLATE_BIENVENIDA
        sync: false
      - key: BREVO_TEMPLATE_RESET_PASSWORD
        sync: false
      - key: BREVO_TEMPLATE_VERIFICACION
        sync: false
      - key: BREVO_TEMPLATE_CANCELACION
        sync: false
      - key: BREVO_TEMPLATE_RACHA_RIESGO
        sync: false
      - key: BREVO_TEMPLATE_REENGAGEMENT
        sync: false
      - key: BREVO_TEMPLATE_AVISO_OFICIAL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: oposicion-age-frontend
    env: static
    plan: free
    staticPublishPath: frontend
    buildCommand: ""
    routes:
      # Chat IA y Asistente se fusionaron en Tu Tutor -- se conservan estas
      # redirecciones para no romper enlaces o marcadores ya guardados.
      - type: redirect
        source: /chat-ai/*
        destination: /tu-tutor/
      - type: redirect
        source: /asistente/*
        destination: /tu-tutor/
      # Canonicalización de URLs para SEO: Search Console mostraba la misma
      # página indexada bajo variantes con y sin barra final, diluyendo las
      # señales de ranking entre ambas. www + https se resuelve a nivel de
      # dominio (Custom Domains de este servicio en el panel de Render, no
      # aquí); esto solo cubre la barra final, que Render no normaliza solo
      # -- sirve el mismo index.html en /planes y /planes/ sin redirigir.
      # Una regla explícita por página (no hay forma de capturar el path y
      # añadirle "/" con un único wildcard en la sintaxis de rutas de Render).
      - type: redirect
        source: /planes
        destination: /planes/
      - type: redirect
        source: /demo
        destination: /demo/
      - type: redirect
        source: /oposicion-administrativo-estado-c1
        destination: /oposicion-administrativo-estado-c1/
      - type: redirect
        source: /oposicion-auxiliar-administrativo-estado
        destination: /oposicion-auxiliar-administrativo-estado/
      - type: redirect
        source: /oposicion-gace
        destination: /oposicion-gace/
      - type: redirect
        source: /como-funciona
        destination: /como-funciona/
      - type: redirect
        source: /como-funciona/estadisticas
        destination: /como-funciona/estadisticas/
      - type: redirect
        source: /como-funciona/herramientas-ia
        destination: /como-funciona/herramientas-ia/
      - type: redirect
        source: /como-funciona/mis-documentos
        destination: /como-funciona/mis-documentos/
      - type: redirect
        source: /como-funciona/mis-tests
        destination: /como-funciona/mis-tests/
      - type: redirect
        source: /como-funciona/repasar-preguntas
        destination: /como-funciona/repasar-preguntas/
      - type: redirect
        source: /como-funciona/test-oficial
        destination: /como-funciona/test-oficial/
      - type: redirect
        source: /como-funciona/test-personalizado
        destination: /como-funciona/test-personalizado/
      - type: redirect
        source: /como-funciona/tu-tutor
        destination: /como-funciona/tu-tutor/
      - type: redirect
        source: /como-funciona/zona-opositor
        destination: /como-funciona/zona-opositor/
      - type: redirect
        source: /comparativa-oposiciones-estado
        destination: /comparativa-oposiciones-estado/
      - type: redirect
        source: /estudiar-oposiciones-con-inteligencia-artificial
        destination: /estudiar-oposiciones-con-inteligencia-artificial/
      - type: redirect
        source: /oposiciones
        destination: /oposiciones/
      - type: redirect
        source: /como-estudiar-oposicion-trabajando
        destination: /como-estudiar-oposicion-trabajando/
      - type: redirect
        source: /sueldo-funcionario-administracion-estado
        destination: /sueldo-funcionario-administracion-estado/
      - type: redirect
        source: /avisos-oficiales
        destination: /avisos-oficiales/
      - type: redirect
        source: /login
        destination: /login/
      - type: redirect
        source: /aviso-legal
        destination: /aviso-legal/
      - type: redirect
        source: /cookies
        destination: /cookies/
      - type: redirect
        source: /privacidad
        destination: /privacidad/
      - type: redirect
        source: /terminos
        destination: /terminos/
      # Cualquier ruta que no corresponda a un fichero real (Render no
      # aplica esta regla si el path sí existe) sirve la página 404 propia
      # en vez del error genérico de Render.
      - type: rewrite
        source: /*
        destination: /404.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      # Ningún fichero estático (CSS/JS de /assets/ ni el propio de cada
      # página, como /estadisticas/style.css) lleva hash en el nombre, así
      # que se usa un TTL corto con revalidación en vez de un max-age largo
      # en TODA la web: evita que un despliegue nuevo deje a los navegadores
      # sirviendo JS/CSS viejo. Antes solo cubría /assets/*, así que los
      # cambios en el CSS/JS propio de una página tardaban en verse
      # reflejados aunque /assets/ sí se actualizara al momento. 60s (no
      # más) mientras el sitio recibe despliegues frecuentes -- un max-age
      # más largo hizo que cambios ya desplegados tardaran hasta una hora en
      # verse reflejados en el navegador de un usuario real.
      - path: /*
        name: Cache-Control
        value: "public, max-age=60, must-revalidate"
      # Sin 'unsafe-inline' en script-src: todo el JS del sitio vive en
      # ficheros .js propios (ningún <script> inline) y no quedan atributos
      # onclick="" inline (los 3 que había se pasaron a addEventListener
      # para poder mantener esta política sin aflojarla).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://oposicion-age.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://us.i.posthog.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
